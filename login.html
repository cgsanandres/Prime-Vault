<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeVault | Sign In</title>
<style>
   :root {
    --bg-color: #0d0e10;
    --runner-grey: #464a4e;
    --plastic-red: #cc0000;
    --safety-yellow: #f9d71c;
    --gundam-blue: #0055aa;
    --panel-dark: #1e1e1e;
    --text-sub: #b3b3b3;
    --ui-glow: rgba(0, 213, 255, 0.4);
    --border-bevel: inset 2px 2px 0px rgba(255,255,255,0.1), inset -2px -2px 0px rgba(0,0,0,0.5);
}

body {
    background-color: var(--bg-color);
    background-image: 
        linear-gradient(rgba(13, 14, 16, 0.9), rgba(13, 14, 16, 0.9)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.02) 3px);
    color: #ffffff;
    font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    overflow-x: hidden;
}

.main-container {
    display: flex;
    gap: 30px;
    max-width: 900px;
    width: 100%;
    align-items: flex-start;
    position: relative;
}
.main-container::before {
    content: "";
    position: absolute;
    top: -10px;
    left: -10px;
    width: 40px;
    height: 40px;
    border-top: 2px solid var(--safety-yellow);
    border-left: 2px solid var(--safety-yellow);
    opacity: 0.6;
}
.main-container::after {
    content: "";
    position: absolute;
    bottom: -10px;
    right: -10px;
    width: 40px;
    height: 40px;
    border-bottom: 2px solid var(--gundam-blue);
    border-right: 2px solid var(--gundam-blue);
    opacity: 0.6;
}

.auth-wrapper {
    background-color: var(--panel-dark);
    padding: 40px;
    border: 2px solid var(--runner-grey);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6), var(--border-bevel);
    flex: 1;
    border-top: 4px solid var(--plastic-red);
    border-left: 4px solid var(--gundam-blue);
    box-sizing: border-box;
    background-image: radial-gradient(var(--runner-grey) 0.5px, transparent 0.5px);
    background-size: 25px 25px;
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.auth-wrapper:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 15px var(--ui-glow), var(--border-bevel);
}
.auth-wrapper::before {
    content: "SECURE ACCESS";
    position: absolute;
    top: 8px;
    right: 15px;
    font-size: 9px;
    color: var(--safety-yellow);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
}

    .separator {
    margin: 35px 0;
    text-align: center;
    border-bottom: 1px solid var(--runner-grey);
    line-height: 0.1em;
    position: relative;
}

.separator span {
    background: var(--panel-dark);
    padding: 0 20px;
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
}

.social-btn {
    width: 100%;
    padding: 14px 12px;
    margin-bottom: 18px;
    border: 2px solid var(--runner-grey);
    background-color: transparent;
    color: var(--pure-white);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: var(--border-bevel);
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}

.social-btn:hover {
    background-color: rgba(0, 85, 170, 0.15);
    border-color: var(--gundam-blue);
    transform: translateX(4px);
    box-shadow: 0 0 12px var(--ui-glow), var(--border-bevel);
}

.social-btn img {
    height: 20px;
    margin-right: 12px;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
}

.apple-btn img {
    filter: invert(1) drop-shadow(0 0 2px rgba(255,255,255,0.3));
}

.demo-panel {
    flex: 0.8;
    background-color: rgba(22, 24, 27, 0.6);
    border: 2px solid var(--safety-yellow);
    box-shadow: inset 0 0 20px rgba(249, 215, 28, 0.08), 0 4px 12px rgba(0,0,0,0.4);
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    position: relative;
    background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(249, 215, 28, 0.02) 8px, rgba(249, 215, 28, 0.02) 16px);
    clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
}

.testing-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background-color: var(--plastic-red);
    color: var(--pure-white);
    font-size: 9px;
    font-weight: 900;
    padding: 5px 14px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
}

.demo-title {
    text-align: center;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 8px;
    color: var(--pure-white);
    text-transform: uppercase;
    letter-spacing: 3px;
    text-shadow: 0 0 8px var(--ui-glow);
}

.demo-subtitle {
    text-align: center;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 20px;
    letter-spacing: 1px;
}

    .role-box {
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid var(--runner-grey);
    padding: 18px 20px;
    box-shadow: var(--border-bevel);
    background-image: radial-gradient(var(--runner-grey) 0.5px, transparent 0.5px);
    background-size: 20px 20px;
    clip-path: polygon(4% 0, 100% 0, 96% 100%, 0 100%);
}

.role-box h4 {
    margin: 0 0 10px 0;
    color: var(--safety-yellow);
    text-transform: uppercase;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-shadow: 0 0 6px rgba(249, 215, 28, 0.2);
}

.role-box p {
    margin: 6px 0;
    font-size: 13px;
    font-family: 'Courier New', Courier, monospace;
    color: var(--pure-white);
    letter-spacing: 0.5px;
}

.role-box span {
    color: var(--text-sub);
    font-weight: 500;
}

.brand-title {
    font-size: 32px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 35px;
    color: var(--pure-white);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--ui-glow);
}

.brand-title span {
    color: var(--plastic-red);
    background: var(--safety-yellow);
    padding: 2px 8px;
    transform: skewX(-15deg);
    display: inline-block;
}

.input-group {
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 900;
}

input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    background-color: var(--bg-color);
    border: 2px solid var(--runner-grey);
    color: var(--pure-white);
    box-sizing: border-box;
    font-size: 15px;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    text-transform: uppercase;
    box-shadow: var(--border-bevel);
    outline: none;
    transition: all 0.3s ease;
}

input[type="text"]:focus,
input[type="password"]:focus {
    border-color: var(--gundam-blue);
    box-shadow: 0 0 12px var(--ui-glow), var(--border-bevel);
    background-color: #000000;
}

.primary-btn {
    width: 100%;
    padding: 16px;
    background-color: var(--safety-yellow);
    color: var(--text-dark);
    border: none;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    letter-spacing: 2px;
    box-shadow: var(--border-bevel);
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}

.primary-btn:hover {
    background-color: #e0c118;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 15px rgba(249, 215, 28, 0.4), var(--border-bevel);
}

@media (max-width: 800px) {
    .main-container {
        flex-direction: column;
        padding: 0 15px;
    }
    .demo-panel {
        width: 100%;
        box-sizing: border-box;
        order: 2;
        margin-top: 30px;
    }
    .auth-wrapper {
        order: 1;
    }
}
</style>
</head>
<body>

<div class="main-container">
    <div class="auth-wrapper">
        <div class="brand-title">Prime<span>Vault</span></div>
       
        <form id="loginForm">
            <div class="input-group">
                <label for="identifier">Email or Username</label>
                <input type="text" id="identifier" required>
            </div>
           
            <div class="input-group">
                <label for="passkey">Password</label>
                <input type="password" id="passkey" required>
            </div>
           
            <button type="submit" class="primary-btn">Sign In</button>
        </form>

        <div class="separator"><span>Or Continue With</span></div>

        <button class="social-btn google-btn" onclick="handleSocial('Google')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
            Sign in with Google
        </button>
       
        <button class="social-btn apple-btn" onclick="handleSocial('Apple')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo">
            Sign in with Apple
        </button>
       
        <div style="text-align: center; margin-top: 25px; font-size: 14px; color: var(--text-sub);">
            Don't have an account? <a href="register.html" style="color: var(--plastic-red); text-decoration: none; font-weight: bold;">Create New Account</a>
        </div>
    </div>

    <div class="demo-panel">
        <div class="testing-badge">Testing Only</div>
        <h2 class="demo-title">Demo Accounts</h2>
        <p class="demo-subtitle">Temporary credentials for role testing</p>

        <div class="role-box">
            <h4>Superadmin Role</h4>
            <p><span>Username:</span> superadmin</p>
            <p><span>Password:</span> superadmin</p>
        </div>

        <div class="role-box">
            <h4>Admin Role</h4>
            <p><span>Username:</span> admin</p>
            <p><span>Password:</span> admin</p>
        </div>

        <div class="role-box">
            <h4>User Role</h4>
            <p><span>Username:</span> user</p>
            <p><span>Password:</span> user</p>
        </div>
    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();
   
    let userVal = document.getElementById("identifier").value.trim().toLowerCase();
    let passVal = document.getElementById("passkey").value.trim();
   
    if (userVal === "superadmin" && passVal === "superadmin") {
        alert("Superadmin access granted. Redirecting to Command Deck...");
        window.location.href = "super-analytics.html";
    } 
    else if (userVal === "admin" && passVal === "admin") {
        alert("Admin access granted. Redirecting to Hangar Ops...");
        window.location.href = "admin-inventory.html";
    } 
    else if (userVal === "user" && passVal === "user") {
        alert("Pilot access granted. Entering Vault...");
        window.location.href = "index.html";
    } 
    else {
        alert("Authentication successful. Welcome to PrimeVault.");
        window.location.href = "index.html";
    }
});

function handleSocial(platform) {
    alert("Authenticating with " + platform + " secure servers...");
    // In a real app, this would trigger the OAuth flow
    window.location.href = "index.html";
}
</script>

</body>
</html>
