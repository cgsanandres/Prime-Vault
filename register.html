<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimeVault | Create New Account</title>
<style>
:root {
    --bg-color: #0d0e10;
    --runner-grey: #464a4e;
    --plastic-red: #cc0000;
    --safety-yellow: #f9d71c;
    --gundam-blue: #0055aa;
    --panel-dark: #1e1e1e;
    --panel-light: #2a2a2a;
    --pure-white: #ffffff;
    --text-sub: #b3b3b3;
    --ui-glow: rgba(0, 213, 255, 0.4);
    --border-bevel: inset 2px 2px 0px rgba(255,255,255,0.1), inset -2px -2px 0px rgba(0,0,0,0.5);
}

body {
    background-color: var(--bg-color);
    background-image: 
        linear-gradient(rgba(13, 14, 16, 0.9), rgba(13, 14, 16, 0.9)),
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.02) 3px);
    color: var(--pure-white);
    font-family: 'Orbitron', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    overflow-x: hidden;
}

.auth-wrapper {
    background-color: var(--panel-dark);
    padding: 40px;
    border: 2px solid var(--runner-grey);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6), var(--border-bevel);
    width: 100%;
    max-width: 450px;
    border-top: 4px solid var(--plastic-red);
    border-left: 4px solid var(--gundam-blue);
    box-sizing: border-box;
    background-image: radial-gradient(var(--runner-grey) 0.5px, transparent 0.5px);
    background-size: 25px 25px;
    clip-path: polygon(3% 0, 100% 0, 97% 100%, 0 100%);
    position: relative;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.auth-wrapper:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 15px var(--ui-glow), var(--border-bevel);
}

.auth-wrapper::before {
    content: "SECURE ACCESS";
    position: absolute;
    top: 8px;
    right: 15px;
    font-size: 9px;
    color: var(--safety-yellow);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.7;
}

.brand-title {
    font-size: 32px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 35px;
    color: var(--pure-white);
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--ui-glow);
}

.brand-title span {
    color: var(--plastic-red);
    background: var(--safety-yellow);
    padding: 2px 8px;
    transform: skewX(-15deg);
    display: inline-block;
}

.input-row {
    display: flex;
    gap: 18px;
    margin-bottom: 20px;
}

.input-group {
    margin-bottom: 25px;
    flex: 1;
}

label {
    display: block;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 900;
}

input[type="text"],
input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    background-color: var(--bg-color);
    border: 2px solid var(--runner-grey);
    color: var(--pure-white);
    box-sizing: border-box;
    font-size: 15px;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    text-transform: uppercase;
    box-shadow: var(--border-bevel);
    outline: none;
    transition: all 0.3s ease;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus {
    border-color: var(--gundam-blue);
    box-shadow: 0 0 12px var(--ui-glow), var(--border-bevel);
    background-color: #000000;
}
    .primary-btn {
    width: 100%;
    padding: 16px;
    background-color: var(--plastic-red);
    color: var(--pure-white);
    border: none;
    font-size: 16px;
    font-weight: 900;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    margin-top: 12px;
    box-shadow: var(--border-bevel);
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}

.primary-btn:hover {
    background-color: #a30000;
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 0 15px rgba(204, 0, 0, 0.4), var(--border-bevel);
}

.separator {
    margin: 35px 0;
    text-align: center;
    border-bottom: 1px solid var(--runner-grey);
    line-height: 0.1em;
    position: relative;
}

.separator span {
    background: var(--panel-dark);
    padding: 0 20px;
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
}

.social-btn {
    width: 100%;
    padding: 14px 12px;
    margin-bottom: 18px;
    border: 2px solid var(--runner-grey);
    background-color: transparent;
    color: var(--pure-white);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Orbitron', 'Segoe UI', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: var(--border-bevel);
    clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
}

.social-btn:hover {
    background-color: rgba(0, 85, 170, 0.15);
    border-color: var(--gundam-blue);
    transform: translateX(4px);
    box-shadow: 0 0 12px var(--ui-glow), var(--border-bevel);
}

.social-btn img {
    height: 20px;
    margin-right: 12px;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
}

.apple-btn img {
    filter: invert(1) drop-shadow(0 0 2px rgba(255,255,255,0.3));
}

.footer-text {
    text-align: center;
    margin-top: 30px;
    font-size: 13px;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.footer-text a {
    color: var(--plastic-red);
    text-decoration: none;
    font-weight: 900;
    transition: all 0.2s ease;
    position: relative;
}

.footer-text a:hover {
    text-decoration: underline;
    color: var(--safety-yellow);
    text-shadow: 0 0 6px var(--plastic-red);
}
</style>
</head>
<body>

<div class="auth-wrapper">
    <div class="brand-title">Prime<span>Vault</span></div>
    
    <form id="registerForm">
        <div class="input-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" required>
        </div>
        
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required>
        </div>

        <div class="input-group">
            <label for="username">Username</label>
            <input type="text" id="username" required>
        </div>
        
        <div class="input-row">
            <div class="input-group" style="margin-bottom: 0;">
                <label for="passkey">Password</label>
                <input type="password" id="passkey" required>
            </div>
            <div class="input-group" style="margin-bottom: 0;">
                <label for="confirmPasskey">Confirm Password</label>
                <input type="password" id="confirmPasskey" required>
            </div>
        </div>
        
        <button type="submit" class="primary-btn">Create Account</button>
    </form>
    
    <div class="separator"><span>OR SIGN UP WITH</span></div>
    
    <button class="social-btn google-btn" onclick="handleSocial('Google')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo">
        Sign up with Google
    </button>
    
    <button class="social-btn apple-btn" onclick="handleSocial('Apple')">
        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple Logo">
        Sign up with Apple
    </button>
    
    <div class="footer-text">
        Already have an account? <a href="login.html">Sign In</a>
    </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();
    
    let nameVal = document.getElementById("fullName").value.trim();
    let emailVal = document.getElementById("email").value.trim();
    let userVal = document.getElementById("username").value.trim();
    let passVal = document.getElementById("passkey").value.trim();
    let confirmPassVal = document.getElementById("confirmPasskey").value.trim();
    
    if (nameVal === "" || emailVal === "" || userVal === "" || passVal === "" || confirmPassVal === "") {
        alert("Registration failed: Please fill out all required fields.");
        return;
    }
    
    if (passVal !== confirmPassVal) {
        alert("Registration failed: Passwords do not match.");
        return;
    }
    
    if (passVal.length < 6) {
        alert("Registration failed: Password must be at least 6 characters long.");
        return;
    }
    
    localStorage.setItem("primeVaultPilot", userVal);
    
    alert("Account created successfully! Welcome to PrimeVault.");
    window.location.href = "login.html";
});

function handleSocial(platform) {
    alert("Initiating registration with " + platform + "...");
    window.location.href = "login.html";
}
</script>

</body>
</html>
